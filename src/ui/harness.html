<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuckoo Harness</title>
<style>
  :root {
    --bg: #0d0e12;
    --bg-sub: #14161c;
    --surface: #191c23;
    --surface-2: #1f232c;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e6e8ee;
    --text-2: #a2a8b6;
    --text-dim: #6b7280;
    --primary: #6b83ff;
    --primary-soft: rgba(107,131,255,0.16);
    --green: #46b47e;
    --red: #ff6369;
    --amber: #e5a24d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    font-size: 14px;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 14px;
    background: var(--bg-sub);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; user-select: none;
    -webkit-app-region: drag;
  }
  .brand { font-weight: 700; font-size: 13px; letter-spacing: .3px; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .topbar .spacer { flex: 1; }
  .status { font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .status.busy { color: var(--amber); }
  .tb-btn {
    -webkit-app-region: no-drag;
    height: 28px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--border-strong); background: transparent;
    color: var(--text-2); font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .tb-btn:hover { background: var(--surface-2); color: var(--text); }
  .tb-btn:active { transform: scale(.97); }

  .stream {
    flex: 1; overflow-y: auto; padding: 24px 0 12px;
  }
  .stream::-webkit-scrollbar { width: 10px; }
  .stream::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 5px; border: 3px solid transparent; background-clip: padding-box; }
  .stream::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); background-clip: padding-box; border: 3px solid transparent; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  .empty { text-align: center; color: var(--text-dim); padding: 80px 20px; font-size: 13px; line-height: 1.9; }
  .empty .big { font-size: 26px; margin-bottom: 12px; }

  .msg { margin-bottom: 20px; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 78%;
    background: var(--primary);
    color: #fff;
    padding: 10px 14px; border-radius: 14px 14px 4px 14px;
    white-space: pre-wrap; word-break: break-word; line-height: 1.6;
    box-shadow: 0 2px 10px rgba(107,131,255,.25);
  }

  .msg.assistant .role {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    letter-spacing: .5px; text-transform: uppercase; margin-bottom: 8px;
  }
  .msg.assistant .role .glyph { color: var(--primary); }
  .msg.assistant .body { line-height: 1.7; color: var(--text); word-break: break-word; }
  .msg.assistant .body p { margin: 0 0 10px; }
  .msg.assistant .body p:last-child { margin-bottom: 0; }
  .msg.assistant .body code {
    background: var(--surface-2); padding: 1px 5px; border-radius: 4px;
    font-family: "SF Mono", "Consolas", monospace; font-size: 12.5px;
    color: #c9d1ff;
  }
  .msg.assistant .body pre {
    background: var(--bg-sub); border: 1px solid var(--border);
    border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  }
  .msg.assistant .body pre code {
    background: none; padding: 0; color: var(--text-2); font-size: 12.5px; line-height: 1.6;
  }

  .tool {
    max-width: 820px; margin: 0 auto 14px; padding: 0 20px;
  }
  .tool-card {
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg-sub); overflow: hidden;
    animation: fade .18s ease;
  }
  .tool-head {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; cursor: pointer; user-select: none;
    background: var(--surface);
  }
  .tool-head:hover { background: var(--surface-2); }
  .tool-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .tool-title { flex: 1; font-size: 12.5px; font-weight: 600; color: var(--text-2); font-family: "SF Mono", "Consolas", monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-weight: 600; flex-shrink: 0; }
  .tool-badge.run { background: rgba(229,162,77,.15); color: var(--amber); }
  .tool-badge.ok { background: rgba(70,180,126,.15); color: var(--green); }
  .tool-badge.err { background: rgba(255,99,105,.15); color: var(--red); }
  .tool-caret { color: var(--text-dim); font-size: 10px; transition: transform .15s; flex-shrink: 0; }
  .tool-card.open .tool-caret { transform: rotate(90deg); }
  .tool-body { display: none; border-top: 1px solid var(--border); }
  .tool-card.open .tool-body { display: block; }
  .tool-sec { padding: 10px 13px; }
  .tool-sec + .tool-sec { border-top: 1px solid var(--border); }
  .tool-sec-label { font-size: 10px; font-weight: 600; color: var(--text-dim); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 7px; }
  .tool-pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 320px; overflow-y: auto;
    font-family: "SF Mono", "Consolas", monospace; font-size: 12px; line-height: 1.6;
    color: var(--text-2); white-space: pre-wrap; word-break: break-word;
  }
  .tool-pre.err { color: #ffb3b6; }

  .composer {
    flex-shrink: 0; padding: 12px 20px 18px;
    background: var(--bg-sub); border-top: 1px solid var(--border);
  }
  .composer-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 12px; padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer-inner:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  #input {
    flex: 1; border: none; outline: none; background: transparent; resize: none;
    color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.6;
    max-height: 200px; min-height: 24px; padding: 2px 0;
  }
  #input::placeholder { color: var(--text-dim); }
  #send {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 9px; border: none;
    background: var(--primary); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; font-size: 15px;
  }
  #send:hover { background: #7d92ff; }
  #send:active { transform: scale(.94); }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { max-width: 820px; margin: 7px auto 0; font-size: 11px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Cuckoo Harness</div>
    <div class="spacer"></div>
    <div class="status" id="status">就绪</div>
    <button class="tb-btn" id="btn-web" title="返回网页模式（Ctrl+Shift+H）">网页模式</button>
  </div>
  <div class="stream" id="stream">
    <div class="empty" id="empty">
      <div class="big">🦜</div>
      纯净对话模式<br>
      只显示你与模型的对话和工具调用<br>
      <span style="font-size:11px">AI 网页在后台运行 · 按 Ctrl+Shift+H 切回</span>
    </div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="输入消息…  Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" title="发送">↑</button>
    </div>
    <div class="hint">此模式下隐藏系统提示词与工具回传等底层指令，仅保留纯净对话</div>
  </div>
</div>
<script>
(function () {
  var api = window.harnessAPI || {};
  var stream = document.getElementById('stream');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusEl = document.getElementById('status');
  var btnWeb = document.getElementById('btn-web');

  var toolSeq = 0;
  var BT = String.fromCharCode(96);
  var FENCE = BT + BT + BT;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMarkdown(text) {
    var src = String(text == null ? '' : text);
    var blocks = [];
    var reFence = new RegExp(FENCE + '([\w-]*)\n?([\s\S]*?)' + FENCE, 'g');
    src = src.replace(reFence, function (m, lang, code) {
      var i = blocks.length;
      blocks.push('<pre><code>' + esc(code) + '</code></pre>');
      return '@@BLOCK' + i + '@@';
    });
    src = esc(src);
    var reInline = new RegExp(BT + '([^' + BT + '\n]+)' + BT, 'g');
    src = src.replace(reInline, '<code>$1</code>');
    src = src.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    var parts = src.split(/\n{2,}/).map(function (p) {
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('');
    return parts.replace(/@@BLOCK(\d+)@@/g, function (m, i) { return blocks[+i] || ''; });
  }

  function scrollBottom() {
    stream.scrollTop = stream.scrollHeight;
  }

  function clearEmpty() {
    if (empty && empty.parentNode) { empty.parentNode.removeChild(empty); empty = null; }
  }

  function addUser(text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg user';
    d.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
    stream.appendChild(d);
    scrollBottom();
  }

  function addAssistant(text) {
    clearEmpty();
    var d = document.createElement('div');
    d.className = 'msg assistant';
    d.innerHTML = '<div class="role"><span class="glyph">◆</span>Assistant</div><div class="body">' + renderMarkdown(text) + '</div>';
    stream.appendChild(d);
    scrollBottom();
  }

  function addToolStart(code) {
    clearEmpty();
    var id = 'tool-' + (++toolSeq);
    var firstLine = String(code || '').split('\n')[0].slice(0, 80) || '工具调用';
    var wrap = document.createElement('div');
    wrap.className = 'tool';
    wrap.innerHTML =
      '<div class="tool-card open" id="' + id + '">' +
        '<div class="tool-head">' +
          '<span class="tool-icon">⚙</span>' +
          '<span class="tool-title">' + esc(firstLine) + '</span>' +
          '<span class="tool-badge run">执行中</span>' +
          '<span class="tool-caret">▶</span>' +
        '</div>' +
        '<div class="tool-body">' +
          '<div class="tool-sec"><div class="tool-sec-label">代码</div><pre class="tool-pre">' + esc(code) + '</pre></div>' +
          '<div class="tool-sec out-sec" style="display:none"><div class="tool-sec-label">结果</div><pre class="tool-pre out-pre"></pre></div>' +
        '</div>' +
      '</div>';
    stream.appendChild(wrap);
    var head = wrap.querySelector('.tool-head');
    head.addEventListener('click', function () { wrap.querySelector('.tool-card').classList.toggle('open'); });
    scrollBottom();
    return id;
  }

  function addToolEnd(success, output, error) {
    var cards = stream.querySelectorAll('.tool-card.open');
    var target = null;
    for (var i = cards.length - 1; i >= 0; i--) {
      var badge = cards[i].querySelector('.tool-badge');
      if (badge && badge.classList.contains('run')) { target = cards[i]; break; }
    }
    if (!target) return;
    var b = target.querySelector('.tool-badge');
    b.className = 'tool-badge ' + (success ? 'ok' : 'err');
    b.textContent = success ? '完成' : '失败';
    var outSec = target.querySelector('.out-sec');
    var outPre = target.querySelector('.out-pre');
    if (outSec && outPre) {
      outSec.style.display = '';
      outPre.textContent = success ? (output || '(无输出)') : (error || '未知错误');
      if (!success) { outPre.classList.add('err'); target.classList.add('open'); }
    }
    scrollBottom();
  }

  function setStatus(text, busy) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (busy ? ' busy' : '');
  }

  if (api.onEvent) {
    api.onEvent(function (payload) {
      if (!payload) return;
      switch (payload.type) {
        case 'user': addUser(payload.text); break;
        case 'assistant': addAssistant(payload.text); setStatus('就绪'); break;
        case 'tool-start': addToolStart(payload.code); setStatus('工具执行中…', true); break;
        case 'tool-end': addToolEnd(payload.success, payload.output, payload.error); setStatus('就绪'); break;
        case 'status': setStatus(payload.text, !!payload.busy); break;
      }
    });
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    setStatus('等待模型…', true);
    if (api.sendMessage) api.sendMessage(text);
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });

  btnWeb.addEventListener('click', function () {
    if (api.exitToWeb) api.exitToWeb();
  });

  input.focus();
  if (api.ready) api.ready();
})();
</script>
</body>
</html>
