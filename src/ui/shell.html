<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cuckoo</title>
<style>
  :root {
    --ck-bg: #ffffff;
    --ck-toolbar: #f5f5f7;
    --ck-surface: rgba(0, 0, 0, 0.04);
    --ck-surface-hover: rgba(0, 0, 0, 0.07);
    --ck-border: #d2d2d7;
    --ck-primary: #0071e3;
    --ck-text: #1d1d1f;
    --ck-text-dim: #6e6e73;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: transparent; color: var(--ck-text); overflow: hidden;
  }
  /* 圆角容器：窗口为透明无边框，圆角由此提供 */
  .shell {
    display: flex; flex-direction: column; height: 100vh;
    background: var(--ck-bg);
    border-radius: 10px;
    border: 1px solid #d2d2d7;
    overflow: hidden;
  }
  /* ===== 自绘仿 macOS 标题栏 ===== */
  .titlebar {
    display: flex; align-items: center;
    height: 38px; padding: 0 12px; flex-shrink: 0;
    background: var(--ck-toolbar);
    border-bottom: 1px solid var(--ck-border);
    -webkit-app-region: drag;
    user-select: none;
  }
  .traffic {
    display: flex; align-items: center; gap: 8px;
    -webkit-app-region: no-drag;
  }
  .traffic .dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s;
  }
  .traffic .dot svg { width: 7px; height: 7px; opacity: 0; transition: opacity .12s; }
  .traffic:hover .dot svg { opacity: 1; }
  .traffic .dot-close { background: #ff5f57; }
  .traffic .dot-min { background: #febc2e; }
  .traffic .dot-max { background: #28c840; }
  .traffic .dot:hover { filter: brightness(1.1); }
  .traffic .dot svg { stroke: rgba(0,0,0,0.55); stroke-width: 2.4; fill: none; }
  .titlebar-title {
    flex: 1; text-align: center;
    font-size: 12.5px; font-weight: 600; color: var(--ck-text-dim);
    letter-spacing: .3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    pointer-events: none;
    padding: 0 76px;
  }
  .toolbar {
    display: flex; align-items: center; gap: 6px;
    height: 44px; padding: 0 10px;
    background: var(--ck-toolbar);
    border-bottom: 1px solid var(--ck-border);
    flex-shrink: 0;
  }
  .nav-btn {
    width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--ck-text-dim);
    transition: background .15s, color .15s;
  }
  .nav-btn:hover { background: var(--ck-surface-hover); color: var(--ck-text); }
  .nav-btn:active { background: var(--ck-surface); }
  .nav-btn.disabled { opacity: .3; cursor: default; pointer-events: none; }
  .nav-btn svg { width: 16px; height: 16px; }
  .url-wrap {
    flex: 1; display: flex; align-items: center;
    height: 30px; padding: 0 10px; margin: 0 4px;
    background: var(--ck-surface);
    border: 1px solid var(--ck-border);
    border-radius: 8px;
    transition: border-color .15s, background .15s;
  }
  .url-wrap:hover { background: var(--ck-surface-hover); }
  .url-wrap:focus-within { border-color: var(--ck-primary); background: rgba(0,0,0,0.05); }
  .lock { width: 12px; height: 12px; flex-shrink: 0; margin-right: 8px; color: #5fbf7f; }
  .url-input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--ck-text); font-size: 13px; font-family: inherit;
  }
  .url-input::placeholder { color: var(--ck-text-dim); }
  .url-input::selection { background: var(--ck-primary); color: #fff; }
  .divider { width: 1px; height: 20px; background: var(--ck-border); margin: 0 4px; }
  .skills-bar {
    display: flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 10px; flex-shrink: 0;
    background: var(--ck-bg);
    border-bottom: 1px solid var(--ck-border);
    overflow-x: auto; overflow-y: hidden;
  }
  .skills-bar.empty { visibility: hidden; } /* 保留高度，避免 AI 区域跳动 */
  .skills-bar::-webkit-scrollbar { height: 0; }
  .skill-chip {
    display: flex; align-items: center; flex-shrink: 0;
    height: 24px; padding: 0 12px; border-radius: 12px;
    background: var(--ck-surface);
    border: 1px solid var(--ck-border);
    color: var(--ck-text); font-size: 12px; line-height: 1;
    cursor: pointer; user-select: none;
    transition: background .15s, border-color .15s, color .15s;
    -webkit-app-region: no-drag;
    white-space: nowrap;
  }
  .skill-chip:hover { background: var(--ck-surface-hover); border-color: var(--ck-primary); color: var(--ck-primary); }
  .skill-chip:active { transform: scale(0.97); }
  .statusbar {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    height: 26px; padding: 0 12px;
    background: var(--ck-toolbar);
    border-bottom: 1px solid var(--ck-border);
    flex-shrink: 0;
    font-size: 12px; color: var(--ck-text-dim);
    user-select: none;
  }
  .statusbar .sb-item { display: flex; align-items: center; gap: 3px; }
  .statusbar .sb-icon { font-size: 11px; opacity: .75; }
  .statusbar .sb-value { color: var(--ck-text); font-variant-numeric: tabular-nums; }
  .statusbar .sb-item[title] { cursor: help; }
  .statusbar .sb-sep { width: 1px; height: 12px; background: var(--ck-border); margin: 0 4px; }
  .viewport { flex: 1; }
  /* ===== Agent 虚拟人头 ===== */
  .agent-hud {
    display: flex; align-items: center; gap: 6px;
    margin-left: 6px; padding-left: 8px;
    border-left: 1px solid var(--ck-border);
    height: 100%; max-width: 420px; overflow-x: auto; overflow-y: hidden;
  }
  .agent-hud::-webkit-scrollbar { height: 0; }
  .agent-hud.empty { display: none; }
  .cuckoo-hidden-hud { display: none !important; }
  .agent-pill {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    height: 26px; padding: 0 9px; border-radius: 13px;
    background: var(--ck-surface);
    border: 1px solid var(--ck-border);
    font-size: 11px; line-height: 1; color: var(--ck-text);
    cursor: default; user-select: none;
    transition: border-color .2s, background .2s;
  }
  .agent-pill-emoji { font-size: 13px; line-height: 1; }
  .agent-pill-name { color: #1d1d1f; font-weight: 600; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-pill-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ff6b7a; flex-shrink: 0;
  }
  .agent-pill-state { color: var(--ck-text-dim); }
  /* 工作中：绿色 + 呼吸闪烁 */
  .agent-pill.working {
    border-color: rgba(74,222,128,0.55);
    background: rgba(74,222,128,0.10);
  }
  .agent-pill.working .agent-pill-dot {
    background: #4ade80;
    animation: agent-dot-blink 1s steps(1,end) infinite;
  }
  .agent-pill.working .agent-pill-state { color: #4ade80; }
  /* 已停止：红色圆点（静态） */
  .agent-pill.idle .agent-pill-state { color: #ff9aa4; }
  @keyframes agent-dot-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="titlebar">
      <div class="traffic">
        <button class="dot dot-close" id="win-close" title="关闭">
          <svg viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8"/></svg>
        </button>
        <button class="dot dot-min" id="win-min" title="最小化">
          <svg viewBox="0 0 10 10"><path d="M2 5 L8 5"/></svg>
        </button>
        <button class="dot dot-max" id="win-max" title="最大化">
          <svg viewBox="0 0 10 10"><path d="M2.5 2.5 L7.5 7.5 M7.5 2.5 L2.5 7.5"/></svg>
        </button>
      </div>
      <div class="titlebar-title" id="titlebar-title">Cuckoo Code Pro</div>
    </div>
    <div class="toolbar">
      <button class="nav-btn disabled" id="btn-back" title="后退">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn disabled" id="btn-forward" title="前进">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <div class="url-wrap">
        <svg class="lock" id="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input class="url-input" id="url-input" placeholder="输入网址后回车" spellcheck="false" autocomplete="off"/>
      </div>
      <div class="divider"></div>
      <button class="nav-btn" id="btn-home" title="主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <div class="agent-hud empty cuckoo-hidden-hud" id="agent-hud" title="子代理（Agent）运行状态"></div>
    </div>
    <div class="skills-bar empty" id="skills-bar"></div>
    <div class="statusbar">
      <div class="sb-item" title="对话上下文：本会话当前占用的 token 总量">
        <span class="sb-icon">💬</span>
        <span class="sb-value" id="sb-context">0</span>
      </div>
      <div class="sb-item" title="对话累计：本会话累计消耗的 token">
        <span class="sb-icon">📈</span>
        <span class="sb-value" id="sb-cumulative">0</span>
      </div>
      <div class="sb-sep"></div>
      <div class="sb-item" title="今日窗口：本窗口今天的累计消耗">
        <span class="sb-icon">📅</span>
        <span class="sb-value" id="sb-today">0</span>
      </div>
      <div class="sb-item" title="窗口累计：本窗口所有会话累计之和">
        <span class="sb-icon">🪟</span>
        <span class="sb-value" id="sb-window">0</span>
      </div>
      <div class="sb-item" title="系统总累计：所有窗口累计之和（含已关闭窗口）">
        <span class="sb-icon">🌐</span>
        <span class="sb-value" id="sb-system">0</span>
      </div>
    </div>
    <div class="viewport"></div>
  </div>
<script>
  var api = window.shellAPI || {};
  // 自绘标题栏按钮
  (function () {
    var closeBtn = document.getElementById('win-close');
    var minBtn = document.getElementById('win-min');
    var maxBtn = document.getElementById('win-max');
    if (closeBtn) closeBtn.addEventListener('click', function () { api.winClose && api.winClose(); });
    if (minBtn) minBtn.addEventListener('click', function () { api.winMinimize && api.winMinimize(); });
    if (maxBtn) maxBtn.addEventListener('click', function () { api.winToggleMaximize && api.winToggleMaximize(); });
  })();
  // 标题栏显示应用版本
  (function () {
    var el = document.getElementById('titlebar-title');
    if (el && api.getAppVersion) {
      api.getAppVersion().then(function (res) {
        if (res && res.success && res.version) el.textContent = 'Cuckoo Code Pro v' + res.version;
      }).catch(function () {});
    }
  })();
  // 技能快捷按钮栏
  function shortSkillName(name) {
    return String(name || '').replace(/\.skills?$/i, '');
  }
  function renderSkillsBar(skills) {
    var bar = document.getElementById('skills-bar');
    if (!bar) return;
    if (!skills || !skills.length) { bar.classList.add('empty'); bar.innerHTML = ''; return; }
    bar.classList.remove('empty');
    bar.innerHTML = skills.map(function (s, i) {
      var label = shortSkillName(s.name);
      return '<div class="skill-chip" data-idx="' + i + '" title="' + String(s.name).replace(/"/g, '&quot;') + '">' + label + '</div>';
    }).join('');
    bar.querySelectorAll('.skill-chip').forEach(function (el) {
      el.addEventListener('click', function () {
        var idx = parseInt(el.getAttribute('data-idx'), 10);
        var s = skills[idx];
        if (!s) return;
        var label = shortSkillName(s.name);
        var trigger = (s.triggers && s.triggers.length) ? s.triggers[0] : '';
        var text = '使用「' + label + '」技能' + (trigger ? '：' + trigger : '');
        if (api.triggerSkill) {
          api.triggerSkill(text).then(function (res) {
            console.log('[Shell] triggerSkill result:', JSON.stringify(res));
          }).catch(function (e) { console.error('[Shell] triggerSkill error:', e); });
        }
      });
    });
  }
  function loadSkillsBar() {
    if (api.getSkills) {
      api.getSkills().then(function (res) {
        if (res && res.success) renderSkillsBar(res.skills);
      }).catch(function () {});
    }
  }
  loadSkillsBar();
  var input = document.getElementById('url-input');
  var btnBack = document.getElementById('btn-back');
  var btnForward = document.getElementById('btn-forward');
  var currentUrl = '';

  function setBtn(btn, enabled) {
    if (enabled) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  }

  if (api.onUrlUpdated) {
    api.onUrlUpdated(function (data) {
      if (!data) return;
      currentUrl = data.url || '';
      if (document.activeElement !== input) input.value = currentUrl;
      setBtn(btnBack, data.canGoBack);
      setBtn(btnForward, data.canGoForward);
      var lock = document.getElementById('lock');
      if (lock) lock.style.color = /^https:/i.test(currentUrl) ? '#5fbf7f' : '#c0a060';
    });
  }

  input.addEventListener('focus', function () { input.select(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var url = input.value.trim();
      if (!url) return;
      if (!/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
      if (api.navigate) api.navigate(url);
      input.blur();
    } else if (e.key === 'Escape') {
      input.value = currentUrl;
      input.blur();
    }
  });

  // 对话 token 显示
  function formatTokenCount(n) {
    if (!isFinite(n) || n < 0) return '0';
    if (n >= 100000000) return (n / 100000000).toFixed(2) + '亿';
    if (n >= 10000) return (n / 10000).toFixed(2) + '万';
    return String(Math.round(n));
  }
  var contextEl = document.getElementById('sb-context');
  var cumulativeEl = document.getElementById('sb-cumulative');
  var windowEl = document.getElementById('sb-window');
  var todayEl = document.getElementById('sb-today');
  var systemEl = document.getElementById('sb-system');
  if (api.onTokenUpdated) {
    api.onTokenUpdated(function (data) {
      if (!data) return;
      if (contextEl) contextEl.textContent = formatTokenCount(data.context);
      if (cumulativeEl) cumulativeEl.textContent = formatTokenCount(data.cumulative);
      if (windowEl) windowEl.textContent = formatTokenCount(data.windowCumulative);
      if (todayEl) todayEl.textContent = formatTokenCount(data.todayCumulative);
    });
  }
  // 系统总累计：订阅广播 + 加载时拉取一次
  if (api.onTotalUpdated) {
    api.onTotalUpdated(function (data) {
      if (data && systemEl) systemEl.textContent = formatTokenCount(data.systemTotal);
    });
  }
  if (api.getSystemTotal) {
    api.getSystemTotal().then(function (r) {
      if (r && r.success && systemEl) systemEl.textContent = formatTokenCount(r.systemTotal);
    }).catch(function () {});
  }

  // ===== Agent 虚拟人头 =====
  var AGENT_EMOJI = {
    'code-reviewer': '🔍', 'reviewer': '🔍',
    'code1': '🧭', 'code2': '🩺', 'code3': '👨💻',
    'researcher': '🧭', 'diagnoser': '🩺', 'engineer': '👨💻',
    'tester': '🧪', 'docs': '📝', 'writer': '📝',
  };
  var AGENT_COLORS = ['#8b93ff', '#4ade80', '#ffb84d', '#ff6b7a', '#5fd0e0', '#c98bff'];
  function agentEmoji(name) {
    if (AGENT_EMOJI[name]) return AGENT_EMOJI[name];
    // 未知 agent：按名字 hash 选一个稳定 emoji
    var pool = ['🤖', '🦾', '🧠', '🐣', '🛰️', '⚙️', '📦', '🔧'];
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return pool[h % pool.length];
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function renderAgents(agents) {
    var hud = document.getElementById('agent-hud');
    if (!hud) return;
    if (!agents || !agents.length) { hud.classList.add('empty'); hud.innerHTML = ''; return; }
    hud.classList.remove('empty');
    hud.innerHTML = agents.map(function (a) {
      var working = !!a.working;
      var stateCls = working ? 'working' : 'idle';
      var stateText = working ? '工作中' : '已停止';
      return '<div class="agent-pill ' + stateCls + '" data-name="' + esc(a.name) + '"' +
        (a.task ? ' title="任务：' + esc(a.task) + '"' : '') + '>' +
        '<span class="agent-pill-emoji">' + agentEmoji(a.name) + '</span>' +
        '<span class="agent-pill-name">' + esc(a.name) + '</span>' +
        '<span class="agent-pill-dot"></span>' +
        '<span class="agent-pill-state">' + stateText + '</span>' +
        '</div>';
    }).join('');
  }
  if (api.onAgentUpdated) {
    api.onAgentUpdated(function (data) { if (data) renderAgents(data.agents); });
  }
  if (api.getAgentStatus) {
    api.getAgentStatus().then(function (r) {
      if (r && r.success) renderAgents(r.agents);
    }).catch(function () {});
  }

  btnBack.addEventListener('click', function () { if (api.back) api.back(); });
  btnForward.addEventListener('click', function () { if (api.forward) api.forward(); });
  document.getElementById('btn-reload').addEventListener('click', function () { if (api.reload) api.reload(); });
  document.getElementById('btn-home').addEventListener('click', function () { if (api.home) api.home(); });
</script>
</body>
</html>
